name: Агент строит

# Дом агента. Запускается на серверах GitHub, а не на машине владельца:
# OpenRouter недоступен ни из песочницы Claude, ни из линуксовой части
# рабочего стола — проверено обе. У раннера GitHub интернет открыт.
#
# Что делает: берёт из журнала задание со статусом «строит», просит модель
# написать страницу, проверяет её и коммитит в staging. Дальше владелец
# смотрит тестовый сайт и решает, пускать ли в бой — тем же порядком, что
# и любые другие изменения.
#
# Почему в staging, а не в main: агент пишет код, который окажется на домене
# владельца. Человек между «построил» и «увидели люди» остаётся.
#
# Нужен один секрет: OPENROUTER_KEY.
#   Settings → Secrets and variables → Actions → New repository secret

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что делать'
        required: false
        default: build
        type: choice
        options:
          - build      # взять задание и построить страницу
          - models     # только показать список моделей, ничего не тратя
  schedule:
    # Каждые 5 минут (чаще GitHub не умеет): агент заглядывает на доски идей
    # и, если есть верхняя идея с голосами и бюджет, строит одну страницу.
    # Без работы запуск заканчивается за минуту и ничего не стоит.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  # Нужно, чтобы агент мог попросить пересборку тестового сайта: GitHub
  # намеренно НЕ запускает workflow от коммитов, сделанных встроенным
  # токеном (защита от бесконечных циклов), поэтому сборку зовём явно.
  actions: write

concurrency:
  group: agent-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Поставить viem
        run: npm install viem --no-save --silent

      # Режим «models»: сверяем список из формы запуска с живым каталогом
      # OpenRouter. Моделей не вызываем, денег не тратим — это не сборка,
      # а проверка, что форма не обещает того, чего агент не может.
      - name: Сверить список моделей
        if: inputs.mode == 'models'
        run: node scripts/agent-run.mjs --models

      - name: Проверить ключ и баланс
        if: inputs.mode != 'models'
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: node scripts/agent-run.mjs --check

      - name: Показать задание
        if: inputs.mode != 'models'
        run: node scripts/agent-run.mjs

      - name: Построить
        if: inputs.mode != 'models'
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: node scripts/agent-run.mjs --run

      - name: Закоммитить, если что-то построено
        id: commit
        if: inputs.mode != 'models'
        run: |
          if [ -z "$(git status --porcelain web/public/agents)" ]; then
            echo "Агент ничего не построил — коммитить нечего."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          git config user.name "hood agent"
          git config user.email "noreply@github.com"
          git add web/public/agents
          git commit -m "агент построил страницу по заданию холдеров

          Собрано на серверах GitHub, результат прошёл проверку на внешние
          скрипты, формы, сетевые запросы и размер. Смотреть на тестовом
          сайте, в бой — обычным порядком."
          git push origin staging
          echo "Закоммичено в staging."

      - name: Попросить пересборку тестового сайта
        if: steps.commit.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-staging.yml --ref staging
          echo "Сборка запущена. Через пару минут: hoodandarrow.com/staging/agents/"
