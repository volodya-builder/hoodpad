name: Deploy staging

# Тестовый сайт: собирает web/ из ветки staging и публикует в gh-pages/staging.
# Живёт на hoodandarrow.com/staging/ — основной сайт (корень gh-pages) не трогает.

on:
  push:
    branches: [staging]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build (base /staging/)
        working-directory: web
        env:
          VITE_BUILD: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}
          # WalletConnect (телефонные кошельки, Ledger Live): Project ID с cloud.reown.com → Settings → Variables → WC_PROJECT_ID
          VITE_WC_PROJECT_ID: ${{ vars.WC_PROJECT_ID }}
          # Замок тестового сайта: SHA-256 пароля (Settings → Variables → STAGING_GATE).
          # Пусто — без замка. См. web/src/components/StagingGate.jsx.
          VITE_STAGING_GATE: ${{ vars.STAGING_GATE }}
        run: |
          npm ci --no-audit --no-fund   # только версии из package-lock.json — без сюрпризов от свежих релизов
          npx vite build --base=/staging/

      - name: Deploy to gh-pages/staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          destination_dir: staging
          keep_files: true
