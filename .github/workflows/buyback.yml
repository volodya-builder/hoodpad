name: hood buyback

# Выкуп монеты hood из казны выкупа (10% всех комиссий платформы).
# Раз в сутки: всё, что накопилось в казне, покупает монету hood с кривой
# и сжигает. Нужны: секрет ARENA_PRIVATE_KEY (владелец казны, тот же, что у
# арены) и переменная HOOD_TOKEN (адрес монеты hood — Settings → Variables).
# Адрес казны выкупа — переменная BUYBACK_TREASURY (необязательно: по умолчанию
# зашит в bot/buyback/buyback.mjs).
#
# Расписание GitHub срабатывает с опозданием на часы (17.09.2026 cron 00:45
# сработал в 05:27), поэтому ритм держит эстафета, как у арены: каждый заход
# в конце ждёт до 00:40 UTC следующих суток (но не дольше 5 ч 40 мин) и
# запускает следующий сам. Бот идемпотентен — лишний запуск не покупает дважды.
# Выключить эстафету: Settings → Variables → BUYBACK_RELAY = off.
# Первый заход эстафеты запускается вручную: Actions → hood buyback → Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Сухой прогон — только показать, без транзакций"
        type: boolean
        default: false
  schedule:
    - cron: '45 0 * * *'

permissions:
  contents: read
  actions: write   # эстафета: запуск следующего захода

concurrency:
  group: buyback
  cancel-in-progress: false

jobs:
  buy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Поставить viem
        run: npm ci --prefix bot --omit=optional --no-audit --no-fund
      - name: Проверить настройки
        env:
          HOOD_TOKEN: ${{ vars.HOOD_TOKEN }}
          HAS_KEY: ${{ secrets.ARENA_PRIVATE_KEY != '' }}
        run: |
          [ -n "$HOOD_TOKEN" ] || { echo "::error::Нет переменной HOOD_TOKEN (Settings → Variables) — адрес монеты hood"; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::Нет секрета ARENA_PRIVATE_KEY"; exit 1; }
      - name: Выкупить hood
        env:
          ARENA_PRIVATE_KEY: ${{ secrets.ARENA_PRIVATE_KEY }}
          HOOD_TOKEN: ${{ vars.HOOD_TOKEN }}
          BUYBACK_TREASURY: ${{ vars.BUYBACK_TREASURY }}
        run: node bot/buyback/buyback.mjs ${{ inputs.dry && '--dry' || '' }}

      # Эстафета: ждём до 00:40 UTC следующих суток, но не дольше 5 ч 40 мин
      # (потолок GitHub на запуск — 6 часов), и запускаем следующий заход.
      - name: Передать эстафету
        if: always() && !inputs.dry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY: ${{ vars.BUYBACK_RELAY }}
        run: |
          if [ "$RELAY" = "off" ]; then echo "Эстафета выключена (BUYBACK_RELAY=off)."; exit 0; fi
          NOW=$(date -u +%s)
          NEXT=$(( (NOW / 86400 + 1) * 86400 + 2400 ))   # завтра 00:40 UTC
          WAIT=$(( NEXT - NOW )); MAX=$(( 5 * 3600 + 40 * 60 ))
          [ "$WAIT" -gt "$MAX" ] && WAIT=$MAX
          OTHERS=$(gh run list --workflow buyback.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' || echo 0)
          if [ "$OTHERS" != "0" ]; then echo "В очереди уже есть запуск — эстафету не передаю."; exit 0; fi
          echo "Следующий заход через $((WAIT / 60)) мин…"; sleep "$WAIT"
          gh workflow run buyback.yml --ref main && echo "Следующий заход запущен."
