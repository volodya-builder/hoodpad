specVersion: 0.0.5
features:
  - grafting
graft:
  base: QmNYxmheyHF6vRyQgoujKYxyf6BGPNDpkMPWkRzV7KMzCY
  block: 62830000
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: LaunchpadFactory
    network: robinhood-mainnet
    source:
      address: "0x08a887196fc31b89305ae03aa991917f6b1d23ec"
      abi: LaunchpadFactory
      startBlock: 18192900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Protocol
      abis:
        - name: LaunchpadFactory
          file: LaunchpadFactory/LaunchpadFactory.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,indexed address,string,string,string)
          handler: handleTokenCreated
      file: LaunchpadFactory/LaunchpadFactory.wasm
  - kind: ethereum
    name: LaunchpadFactoryQuote
    network: robinhood-mainnet
    source:
      address: "0xd7299e03c5e7d4f9f4c62f305a0b619359cf9a4f"
      abi: LaunchpadFactoryQuote
      startBlock: 62830000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Protocol
      abis:
        - name: LaunchpadFactoryQuote
          file: LaunchpadFactoryQuote/LaunchpadFactoryQuote.json
        - name: DividendToken
          file: LaunchpadFactoryQuote/DividendToken.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,indexed address,address,uint16)
          handler: handleQuoteTokenCreated
      file: LaunchpadFactory/LaunchpadFactory.wasm
  - kind: ethereum
    name: BuybackTreasury
    network: robinhood-mainnet
    source:
      address: "0xb45661df6625decdc697dd2fa0556c2637ea063a"
      abi: BuybackTreasury
      startBlock: 18192900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TreasuryOp
        - Protocol
      abis:
        - name: BuybackTreasury
          file: BuybackTreasury/BuybackTreasury.json
      eventHandlers:
        - event: Received(indexed address,uint256)
          handler: handleReceived
        - event: Buyback(indexed address,indexed address,uint256,uint256)
          handler: handleBuyback
        - event: Burned(indexed address,uint256)
          handler: handleBurned
      file: BuybackTreasury/BuybackTreasury.wasm
templates:
  - kind: ethereum
    name: BondingCurvePool
    network: robinhood-mainnet
    source:
      abi: BondingCurvePool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Trade
        - Protocol
      abis:
        - name: BondingCurvePool
          file: BondingCurvePool/BondingCurvePool.json
      eventHandlers:
        - event: Buy(indexed address,uint256,uint256,uint256)
          handler: handleBuy
        - event: Sell(indexed address,uint256,uint256,uint256)
          handler: handleSell
        - event: Graduated(uint256,uint256)
          handler: handleGraduated
      file: templates/BondingCurvePool/BondingCurvePool.wasm
