specVersion: 0.0.5
# Графт: 3.1.0 наследует все данные 3.0.0 до блока 62 830 000 (за 8 минут до
# деплоя квот-фабрики) и индексирует дальше сама — минуты вместо часов.
# При передеплое фабрик перед запуском графт убрать и стартовать с нуля.
# Перезапуск 16.09.2026: без graft — новые фабрики индексируются с нуля,
# старые монеты в индекс не попадают.
schema:
  file: ./schema.graphql
dataSources:
  # --- hood v2 (мейннет, задеплоено 22.07.2026) ---
  # События v2 идентичны v1 (TokenCreated / Buy / Sell / Received / Buyback /
  # Burned), поэтому ABI и мэппинги те же — меняются только адреса и блок.
  # Голосование v2 (VotePower) фронт читает напрямую по RPC — в сабграфе не нужно.
  - kind: ethereum
    name: LaunchpadFactory
    network: robinhood-mainnet
    source:
      address: "0xbe3e7ca55b6c4fc9e759bc8b43734b57a582da01"
      abi: LaunchpadFactory
      startBlock: 64580000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Token, Protocol]
      abis:
        - name: LaunchpadFactory
          file: ./abis/LaunchpadFactory.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,indexed address,string,string,string)
          handler: handleTokenCreated
      file: ./src/factory.ts
  # --- квот-фабрика: монеты за акции/валюту (задеплоено 14.09.2026). Пулы
  # шлют те же Buy/Sell/Graduated, поэтому шаблон пула общий; в контексте
  # лежит адрес валюты, чтобы фронт отличал единицы.
  - kind: ethereum
    name: LaunchpadFactoryQuote
    network: robinhood-mainnet
    source:
      address: "0x4b55954a2910cfbb04f49e90e727fb1540b3a940"
      abi: LaunchpadFactoryQuote
      startBlock: 64580000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Token, Protocol]
      abis:
        - name: LaunchpadFactoryQuote
          file: ./abis/LaunchpadFactoryQuote.json
        - name: DividendToken
          file: ./abis/DividendToken.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,indexed address,address,uint16)
          handler: handleQuoteTokenCreated
      file: ./src/factory.ts
  - kind: ethereum
    name: BuybackTreasury
    network: robinhood-mainnet
    source:
      address: "0xb45661df6625decdc697dd2fa0556c2637ea063a"
      abi: BuybackTreasury
      startBlock: 64580000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [TreasuryOp, Protocol]
      abis:
        - name: BuybackTreasury
          file: ./abis/BuybackTreasury.json
      eventHandlers:
        - event: Received(indexed address,uint256)
          handler: handleReceived
        - event: Buyback(indexed address,indexed address,uint256,uint256)
          handler: handleBuyback
        - event: Burned(indexed address,uint256)
          handler: handleBurned
      file: ./src/treasury.ts
templates:
  - kind: ethereum
    name: BondingCurvePool
    network: robinhood-mainnet
    source:
      abi: BondingCurvePool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Token, Trade, Protocol, PriceSource]
      abis:
        - name: BondingCurvePool
          file: ./abis/BondingCurvePool.json
        - name: UniswapV3Factory
          file: ./abis/UniswapV3Factory.json
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Buy(indexed address,uint256,uint256,uint256)
          handler: handleBuy
        - event: Sell(indexed address,uint256,uint256,uint256)
          handler: handleSell
        - event: Graduated(uint256,uint256)
          handler: handleGraduated
      file: ./src/pool.ts
