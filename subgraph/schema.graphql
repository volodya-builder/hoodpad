type Token @entity(immutable: false) {
  id: ID!                # адрес токена
  name: String!
  symbol: String!
  metadataURI: String!
  creator: Bytes!
  pool: Bytes!
  createdAt: BigInt!
  createdBlock: BigInt!
  graduated: Boolean!
  quote: Bytes          # валюта курвы: null — ETH, иначе адрес ERC20 (квот-фабрика)
  divBps: Int           # налог в пользу холдеров (монеты за валюту); null/0 — нет. Nullable — ради графта
  ethReserve: BigInt!   # у монет за валюту — в единицах валюты
  tokensSold: BigInt!
  tradesCount: Int!
  volumeEth: BigInt!
  feesEth: BigInt!
  volumeUsd: BigDecimal!  # объём в долларах по курсу на момент каждой сделки (не «дышит»)
  feesUsd: BigDecimal!
  lastTradeAt: BigInt!
  trades: [Trade!]! @derivedFrom(field: "token")
}

type Trade @entity(immutable: true) {
  id: ID!                # txHash-logIndex
  token: Token!
  pool: Bytes!
  trader: Bytes!
  isBuy: Boolean!
  quote: Bytes          # null — сделка в ETH; иначе ethAmount и fee — в единицах этой валюты
  ethAmount: BigInt!
  tokenAmount: BigInt!
  fee: BigInt!
  usd: BigDecimal!       # (ethAmount + fee) в долларах по курсу блока сделки; 0 — курса не было
  feeUsd: BigDecimal!
  rateUsd: BigDecimal!   # курс валюты сделки (ETH или квот-актива) в долларах в этом блоке
  timestamp: BigInt!
  block: BigInt!
  tx: Bytes!
}

# Откуда берём курс валюты: самый глубокий пул Uniswap V3 против USDG или WETH
type PriceSource @entity(immutable: false) {
  id: ID!                # адрес валюты
  pool: Bytes!
  base: String!          # "usdg" | "weth" | "" (пула нет)
  quoteIsToken0: Boolean!
  quoteDec: Int!
  baseDec: Int!
  checkedAt: BigInt!
}

type VoteCast @entity(immutable: true) {
  id: ID!
  token: Bytes!
  voter: Bytes!
  epoch: BigInt!
  timestamp: BigInt!
}

type TreasuryOp @entity(immutable: true) {
  id: ID!
  kind: String!          # received | buyback | burned | converted
  treasury: Bytes        # какая казна (арена / выкуп hood)
  from: Bytes
  token: Bytes
  asset: Bytes           # чем платили: 0x0 — ETH, иначе валюта монеты
  ethAmount: BigInt      # ETH (для buyback — только если платили ETH; для converted — сколько ETH получено)
  assetAmount: BigInt    # сколько валюты потрачено (buyback за валюту / converted)
  tokenAmount: BigInt
  note: String
  timestamp: BigInt!
  tx: Bytes!
}

type Protocol @entity(immutable: false) {
  id: ID!                # всегда "1"
  tokensCount: Int!
  graduatedCount: Int!
  tradesCount: Int!
  volumeEth: BigInt!
  feesEth: BigInt!
  volumeUsd: BigDecimal!  # все монеты (ETH и за валюту) по курсу на момент сделки
  feesUsd: BigDecimal!
  treasuryReceived: BigInt!
  treasurySpent: BigInt!
}
